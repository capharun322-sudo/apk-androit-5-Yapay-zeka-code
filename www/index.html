<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeMate</title>
<style>
:root{--bg:#faf9f5;--ink:#1f1e1d;--mut:#83827d;--acc:#d97757;--ub:#f0eee6;--card:#fff;--line:#e6e4dc;--code:#1f1e1d;--codeink:#ece9e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#262624;--ink:#f3f1ea;--mut:#9a978e;--ub:#3a3936;--card:#30302e;--line:#42413d;--code:#1b1a19}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;font:600 19px Georgia,"Times New Roman",serif}
.logo i{color:var(--acc);font-style:normal;font-size:22px}
.hb{display:flex;gap:6px}
.hb button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:5px 12px;font:13px system-ui}
#log{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:18px;max-width:760px;width:100%;margin:0 auto}
.u{align-self:flex-end;background:var(--ub);border-radius:18px;padding:9px 14px;max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.a{display:flex;gap:10px;align-items:flex-start}
.a>i{color:var(--acc);font-style:normal;font-size:20px;line-height:1.5;flex:none}
.a .t{min-width:0;flex:1}
.p{margin:0 0 10px;white-space:pre-wrap;word-wrap:break-word}.p:last-child{margin:0}
.h{font-weight:700;margin:6px 0 6px}
code.i{background:var(--ub);border-radius:5px;padding:1px 5px;font:14px ui-monospace,Menlo,Consolas,monospace}
.cb{background:var(--code);border-radius:12px;margin:8px 0;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;color:#a9a69d;font:12px system-ui;border-bottom:1px solid #ffffff14}
.ch button{background:none;border:0;color:#cfcbc1;font:12px system-ui;padding:2px 4px}
.cb pre{margin:0;padding:12px;overflow-x:auto;color:var(--codeink);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;tab-size:4}
.th{color:var(--mut);animation:pu 1.4s ease-in-out infinite}
@keyframes pu{50%{opacity:.35}}
.empty{margin:auto;text-align:center;padding:20px}
.empty .big{font:400 30px/1.25 Georgia,serif;margin:6px 0 4px}
.empty .big i{color:var(--acc);font-style:normal;display:block;font-size:38px}
.empty p{color:var(--mut);margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font:14px system-ui}
.box{margin:0 auto 10px;width:calc(100% - 24px);max-width:736px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:10px 10px 8px 16px;box-shadow:0 2px 10px #0000000d}
textarea{width:100%;border:0;outline:0;resize:none;background:none;color:var(--ink);font:16px/1.5 system-ui;max-height:160px;padding:2px 0}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
#mdl{background:none;border:0;color:var(--mut);font:13px system-ui;padding:4px 0}
#send{width:36px;height:36px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:18px;line-height:1}
#send:disabled{opacity:.35}
</style>
</head>
<body>
<header><div class="logo"><i>✻</i>CodeMate</div><div class="hb"><button id="key" type="button">Anahtar</button><button id="clr" type="button">Yeni</button></div></header>
<div id="log"></div>
<div class="box"><textarea id="q" rows="1" placeholder="Kodunu yapıştır veya sorunu yaz..."></textarea>
<div class="row"><button id="mdl" type="button">Opus 5.5 ▾</button><button id="send" type="button" disabled>↑</button></div></div>
<script>
(function(){
var log=document.getElementById('log'),q=document.getElementById('q'),sb=document.getElementById('send'),mb=document.getElementById('mdl');
var hist=[],busy=false,MODELS=[['claude-opus-5-5','Opus 5.5 · en güçlü'],['claude-sonnet-5-5','Sonnet 5.5 · hızlı']],mi=0;
var SYS="Adın CodeMate. Sen deneyimli bir yazılım mühendisi ve kod asistanısın. Kullanıcı C, C++, Python ve Java ile çalışıyor; takıldığı veya kafasının karıştığı yerlerde sana geliyor. Türkçe cevap ver, kod ve tanımlayıcılar İngilizce kalsın.\nKurallar:\n1) Hata aramada önce en olası kök nedeni söyle, ilgili satırı/ifadeyi göster, sonra düzeltilmiş kodu eksiksiz ver. Sadece belirtiyi değil nedeni açıkla.\n2) Kendi yazdığın kodu vermeden önce zihninde derle ve çalıştır: sınır durumları, tür ve taşma hataları, bellek (C/C++: tanımsız davranış, sızıntı, dangling pointer, buffer taşması, off-by-one; Python: mutable default, sürüm farkı, indent; Java: NPE, equals/hashCode, thread güvenliği) ve derleme hatalarını kontrol et; bulduğun hatayı düzelt.\n3) C/C++ için uygun derleme bayraklarını öner (-Wall -Wextra -fsanitize=address,undefined).\n4) Eksik bilgi (derleyici, sürüm, tam hata mesajı) varsa varsayımını belirt, en iyi cevabı yine ver; gerekirse tek kısa soru sor.\n5) Kod blokları ```dil biçiminde olsun. Gereksiz giriş ve süs yok, kısa ve net ol. Güncel API/sürüm bilgisi gerekirse web aramasını kullan.";
function el(t,c,x){var d=document.createElement(t);if(c)d.className=c;if(x!=null)d.textContent=x;return d}
function scr(){log.scrollTop=log.scrollHeight}
function getKey(){try{return localStorage.getItem('ak')||''}catch(e){return ''}}
function setKey(){var k=prompt('Anthropic API anahtarını yapıştır (sk-ant-...). Sadece bu telefonda saklanır:',getKey());if(k!==null){try{localStorage.setItem('ak',k.trim())}catch(e){}}}
document.getElementById('key').onclick=setKey;
mb.onclick=function(){mi=1-mi;mb.textContent=MODELS[mi][1]+' ▾'};
mb.textContent=MODELS[0][1]+' ▾';
function inline(n,s){s.split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach(function(t){if(!t)return;
 if(t[0]==='`'&&t.length>2)n.appendChild(el('code','i',t.slice(1,-1)));
 else if(t.slice(0,2)==='**'&&t.length>4)n.appendChild(el('b',null,t.slice(2,-2)));
 else n.appendChild(document.createTextNode(t))})}
function prose(box,s){s.split(/\n{2,}/).forEach(function(b){b=b.trim();if(!b)return;
 var d=el('div',/^#{1,4} /.test(b)?'h':'p');inline(d,b.replace(/^#{1,4} /,''));box.appendChild(d)})}
function code(box,s){var nl=s.indexOf('\n'),lang=(nl>-1?s.slice(0,nl):'').trim(),c=(nl>-1?s.slice(nl+1):s).replace(/\n$/,'');
 var w=el('div','cb'),h=el('div','ch'),b=el('button',null,'Kopyala');b.type='button';
 b.onclick=function(){try{navigator.clipboard.writeText(c).then(function(){b.textContent='Kopyalandı'},function(){b.textContent='Kopyalanamadı'})}catch(e){b.textContent='Kopyalanamadı'}};
 h.appendChild(el('span',null,lang||'kod'));h.appendChild(b);var pre=el('pre');pre.appendChild(el('code',null,c));w.appendChild(h);w.appendChild(pre);box.appendChild(w)}
function render(box,text){box.textContent='';text.split('```').forEach(function(p,i){if(i%2===0)prose(box,p);else code(box,p)})}
function empty(){log.textContent='';var e=el('div','empty');e.innerHTML='<div class="big"><i>✻</i>Hangi kodla uğraşıyoruz?</div><p>C, C++, Python, Java: hata bul, düzelt, açıkla.</p>';
 var c=el('div','chips');[['Bu koddaki hatayı bul:\n',0],['Segmentation fault neden olur?',0],['Bu kodu daha hızlı yap:\n',0],['Pointer ve referans farkı nedir?',0]].forEach(function(x){var b=el('button',null,x[0].replace(/:\n$/,''));b.type='button';b.onclick=function(){q.value=x[0];grow();q.focus()};c.appendChild(b)});
 e.appendChild(c);log.appendChild(e)}
function grow(){q.style.height='auto';q.style.height=Math.min(q.scrollHeight,160)+'px';sb.disabled=busy||!q.value.trim()}
q.addEventListener('input',grow);
async function ask(){
 var t=q.value.trim();if(!t||busy)return;
 if(!getKey()){setKey();if(!getKey())return}
 if(!hist.length)log.textContent='';
 busy=true;q.value='';grow();log.appendChild(el('div','u',t));
 var row=el('div','a'),tb=el('div','t');row.appendChild(el('i',null,'✻'));row.appendChild(tb);log.appendChild(row);
 tb.appendChild(el('div','th','Düşünüyor...'));scr();
 var txt='',pend=false;
 function paint(){if(pend)return;pend=true;requestAnimationFrame(function(){pend=false;render(tb,txt);scr()})}
 try{
  var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
   body:JSON.stringify({model:MODELS[mi][0],max_tokens:16000,stream:true,system:SYS,messages:hist.slice(-20).concat([{role:'user',content:t}]),tools:[{type:'web_search_20250305',name:'web_search',max_uses:3}]})});
  if(!res.ok){var j=await res.json();throw new Error(j.error&&j.error.message||res.status)}
  var rd=res.body.getReader(),dec=new TextDecoder(),buf='';
  for(;;){var r=await rd.read();if(r.done)break;buf+=dec.decode(r.value,{stream:true});var ls=buf.split('\n');buf=ls.pop();
   for(var k=0;k<ls.length;k++){var l=ls[k];if(l.indexOf('data: ')!==0)continue;var ev=null;try{ev=JSON.parse(l.slice(6))}catch(_){}
    if(!ev)continue;
    if(ev.type==='error')throw new Error(ev.error&&ev.error.message||'akış hatası');
    if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){txt+=ev.delta.text;paint()}}}
  render(tb,txt||'(boş cevap)');
  hist.push({role:'user',content:t},{role:'assistant',content:txt||'(boş)'});
 }catch(e){tb.textContent='';tb.appendChild(el('div','p','Hata: '+(e&&e.message||e)))}
 busy=false;grow();scr();
}
sb.onclick=ask;
document.getElementById('clr').onclick=function(){if(busy)return;hist=[];empty()};
empty();
})();
</script>
</body>
</html>
